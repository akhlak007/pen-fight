services:
  - type: web
    name: pen-fight
    runtime: node
    rootDir: game-web
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: VITE_WS_MODE
        value: server
    disk:
      name: pen-fight-data
      mountPath: /var/data
      sizeGB: 1
